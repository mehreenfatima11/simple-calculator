<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="calculator">
    <div class="calculator__display">
      <div class="calculator__history" id="history"></div>
      <div class="calculator__value" id="display">0</div>
    </div>

    <div class="calculator__keys">
      <button class="key key--fn" data-action="clear">AC</button>
      <button class="key key--fn" data-action="negate">+/&minus;</button>
      <button class="key key--fn" data-action="percent">%</button>
      <button class="key key--op" data-action="divide">&divide;</button>

      <button class="key" data-number="7">7</button>
      <button class="key" data-number="8">8</button>
      <button class="key" data-number="9">9</button>
      <button class="key key--op" data-action="multiply">&times;</button>

      <button class="key" data-number="4">4</button>
      <button class="key" data-number="5">5</button>
      <button class="key" data-number="6">6</button>
      <button class="key key--op" data-action="subtract">&minus;</button>

      <button class="key" data-number="1">1</button>
      <button class="key" data-number="2">2</button>
      <button class="key" data-number="3">3</button>
      <button class="key key--op" data-action="add">+</button>

      <button class="key key--wide" data-number="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key key--op key--equals" data-action="equals">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
